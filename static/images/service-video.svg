<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F"/>
      <stop offset="100%" style="stop-color:#112240"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B4922A"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Video camera icon -->
  <rect x="130" y="90" width="100" height="70" rx="10" fill="url(#goldGrad)"/>
  <polygon points="230,110 230,150 265,130" fill="#D4AF37"/>
  <rect x="265" y="115" width="15" height="25" rx="3" fill="#D4AF37"/>
  
  <!-- Play button overlay -->
  <circle cx="200" cy="150" r="25" fill="rgba(212,175,55,0.2)"/>
  <polygon points="195,140 195,160 215,150" fill="#D4AF37"/>
  
  <text x="200" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#FFFFFF">Video Production</text>
</svg>