<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F"/>
      <stop offset="100%" style="stop-color:#112240"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B4922A"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Decorative elements -->
  <circle cx="700" cy="100" r="150" fill="url(#goldGrad)" opacity="0.1"/>
  <circle cx="100" cy="400" r="100" fill="url(#goldGrad)" opacity="0.08"/>
  
  <!-- Main icon container -->
  <rect x="325" y="175" width="150" height="150" rx="20" fill="url(#goldGrad)"/>
  <polygon points="360,210 360,290 430,250" fill="#0A192F"/>
  
  <!-- Text -->
  <text x="400" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#FFFFFF">Premium Creative Production</text>
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#D4AF37">Transforming Vision into Captivating Content</text>
</svg>