<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F"/>
      <stop offset="100%" style="stop-color:#112240"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B4922A"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Shopping bag / product icon -->
  <rect x="155" y="100" width="90" height="80" rx="10" fill="url(#goldGrad)"/>
  <path d="M165 100 L165 90 Q200 75 235 90 L235 100" fill="none" stroke="#D4AF37" stroke-width="4"/>
  
  <!-- Star badge -->
  <polygon points="200,120 203,130 213,130 205,136 208,146 200,140 192,146 195,136 187,130 197,130" fill="#0A192F"/>
  
  <!-- Lines representing product info -->
  <rect x="165" y="150" width="70" height="6" rx="3" fill="#0A192F" opacity="0.3"/>
  <rect x="175" y="162" width="50" height="6" rx="3" fill="#0A192F" opacity="0.2"/>
  
  <text x="200" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#FFFFFF">Product Advertising</text>
</svg>