<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F"/>
      <stop offset="100%" style="stop-color:#112240"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B4922A"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Image frame -->
  <rect x="50" y="50" width="500" height="250" rx="10" fill="#112240" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Mountain landscape -->
  <polygon points="50,300 150,150 250,300" fill="#112240"/>
  <polygon points="200,300 350,120 500,300" fill="#1a2d4a"/>
  <polygon points="350,300 450,180 550,300" fill="#112240"/>
  
  <!-- Sun -->
  <circle cx="450" cy="100" r="30" fill="#D4AF37" opacity="0.8"/>
  
  <!-- Camera/film strip decoration -->
  <rect x="250" y="160" width="100" height="80" rx="5" fill="rgba(212,175,55,0.1)" stroke="#D4AF37" stroke-width="1"/>
  <circle cx="300" cy="200" r="25" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <polygon points="292,188 292,212 308,200" fill="#D4AF37"/>
  
  <!-- Play icon overlay -->
  <circle cx="300" cy="200" r="20" fill="rgba(212,175,55,0.2)"/>
  <polygon points="295,190 295,210 315,200" fill="#D4AF37"/>
  
  <!-- Project label -->
  <rect x="50" y="320" width="500" height="50" rx="5" fill="#112240"/>
  <rect x="70" y="335" width="40" height="20" rx="3" fill="url(#goldGrad)"/>
  <rect x="120" y="338" width="200" height="6" rx="3" fill="#233554"/>
  <rect x="120" y="352" width="150" height="6" rx="3" fill="#233554" opacity="0.5"/>
  
  <text x="450" y="355" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#D4AF37">View Project</text>
</svg>