<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F"/>
      <stop offset="100%" style="stop-color:#112240"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B4922A"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Building icon -->
  <rect x="150" y="80" width="100" height="100" rx="5" fill="url(#goldGrad)"/>
  <rect x="165" y="95" width="25" height="30" fill="#0A192F" opacity="0.3"/>
  <rect x="210" y="95" width="25" height="30" fill="#0A192F" opacity="0.3"/>
  <rect x="165" y="135" width="25" height="30" fill="#0A192F" opacity="0.3"/>
  <rect x="210" y="135" width="25" height="30" fill="#0A192F" opacity="0.3"/>
  
  <!-- Columns -->
  <rect x="140" y="180" width="15" height="40" fill="#D4AF37"/>
  <rect x="192" y="180" width="15" height="40" fill="#D4AF37"/>
  <rect x="245" y="180" width="15" height="40" fill="#D4AF37"/>
  
  <!-- Steps -->
  <rect x="130" y="220" width="140" height="10" fill="#D4AF37" opacity="0.7"/>
  <rect x="120" y="230" width="160" height="10" fill="#D4AF37" opacity="0.5"/>
  
  <text x="200" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#FFFFFF">Corporate Services</text>
</svg>